name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Gradle 8.11.1 (без wrapper-файлов проекта)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Сборка debug APK модуля :app
        run: gradle :app:assembleDebug --stacktrace

      - name: Загрузка APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: skhoron-notes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
